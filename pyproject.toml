[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comp"
version = "0.1.0a0"
description = "Receipt-gated proof package compiler for obligation, reference, calculation, and commit workflows"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]
db = ["PyMySQL>=1.1"]

[tool.setuptools]
packages = [
  "comp",
  "comp.cli",
  "comp.compiler_tool",
  "comp.explanation",
  "comp.judgment",
  "comp.persistence",
  "comp.runtime",
  "comp.scenario_contracts",
  "comp.scenarios",
  "comp.scenarios.synthetic",
  "comp.views",
  "minchoagnt",
]

[tool.setuptools.package-data]
"comp.scenarios.synthetic" = ["profiles/*.yaml"]

[project.scripts]
comp = "comp.cli.scenario:main"
minchoagnt = "minchoagnt.cli:main"
comp-receipt-graph = "comp.explanation.receipt_graph_cli:main"
