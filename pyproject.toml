[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comp"
version = "0.1.0a0"
description = "Experimental ESG evidence compiler driven by ESGDL"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
  "comp",
  "comp.compiler_tool",
  "comp.judgment",
  "minchoagnt",
]

[project.scripts]
minchoagnt = "minchoagnt.cli:main"
