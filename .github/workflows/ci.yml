name: Contract CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    name: Python contract suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: comp_test
          MYSQL_USER: comp
          MYSQL_PASSWORD: comp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucomp -pcomp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,db]"

      - name: Wait for MySQL TCP readiness
        run: |
          python - <<'PY'
          import socket
          import time

          host = "127.0.0.1"
          port = 3306
          deadline = time.time() + 90
          last_error = None
          while time.time() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print("MySQL TCP port is reachable.")
                      raise SystemExit(0)
              except OSError as exc:
                  last_error = exc
                  time.sleep(2)
          raise SystemExit(f"MySQL did not become reachable in time: {last_error}")
          PY

      - name: Run unit and scenario tests
        env:
          COMP_TEST_MYSQL_HOST: 127.0.0.1
          COMP_TEST_MYSQL_PORT: "3306"
          COMP_TEST_MYSQL_USER: comp
          COMP_TEST_MYSQL_PASSWORD: comp
          COMP_TEST_MYSQL_DATABASE: comp_test
        run: python -m pytest -q

      - name: List registered domain scenarios
        run: python -m tests.domain_scenarios list

      - name: Run domain scenario contract gate
        run: python -m tests.domain_scenarios run-all
